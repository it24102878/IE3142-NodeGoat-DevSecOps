name: DevSecOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. BUILD AND TEST
  # ==========================================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest


    env:
      MONGODB_URI: ${{ secrets.NODEGOAT_MONGODB_URI }}
      COOKIE_SECRET: ${{ secrets.NODEGOAT_COOKIE_SECRET }}
      CRYPTO_KEY: ${{ secrets.NODEGOAT_CRYPTO_KEY }}
      ZAP_API_KEY: ${{ secrets.NODEGOAT_ZAP_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required runtime secrets
        shell: bash
        run: |
          test -n "$MONGODB_URI" || { echo "MONGODB_URI is not configured"; exit 1; }
          test -n "$COOKIE_SECRET" || { echo "COOKIE_SECRET is not configured"; exit 1; }
          test -n "$CRYPTO_KEY" || { echo "CRYPTO_KEY is not configured"; exit 1; }
          test -n "$ZAP_API_KEY" || { echo "ZAP_API_KEY is not configured"; exit 1; }
          echo "Required runtime secrets are configured."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "12"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build Docker image
        run: docker build -t nodegoat-secure .


  # ==========================================
  # 2. DEPENDENCY SCANNING
  # ==========================================
  dependency-scan:
    name: npm Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "12"

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit || true


  # ==========================================
  # 3. SEMGREP SAST
  # ==========================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan --config auto /src


  # ==========================================
  # 4. GITLEAKS SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"


  # ==========================================
  # 5. TRIVY CONTAINER SCANNING
  # ==========================================
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t nodegoat-secure .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "nodegoat-secure"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"